<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>研究生重开模拟器</title>
<style>
:root{font-family:"SimSun","宋体","Songti SC","Noto Serif CJK SC",serif;color:#e9edf4;background:#0e1420;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#29364c 0,transparent 48%),#0e1420}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:940px;margin:auto;padding:28px 16px 65px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #394354;padding:0 0 18px;margin-bottom:20px}.brand{font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:1px}.muted{font-size:13px;color:#aab5c6}.pill{border:1px solid #68768a;border-radius:99px;padding:7px 12px;color:#e4d2aa;font-size:12px;white-space:nowrap}
.card{background:#1a2331;border:1px solid #3b4759;border-radius:15px;padding:22px;box-shadow:0 12px 35px #0002}.card h2{font-size:24px;margin:6px 0 12px}.eyebrow{font-family:"Times New Roman",serif;font-size:11px;letter-spacing:2px;color:#d2b77e}.intro{line-height:1.85;color:#c4cdda;margin:0 0 14px}.field{display:grid;grid-template-columns:1fr 104px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #354052}.field label{font-size:17px;font-weight:bold;cursor:help}.tier{font-size:12px;color:#cdbb91;margin-top:5px}.num{width:100%;background:#101824;color:#fff;border:1px solid #69778a;border-radius:8px;padding:10px;text-align:center;font-size:20px}.meter{height:7px;border-radius:10px;background:#0d1420;overflow:hidden;margin:13px 0 7px}.fill{height:100%;background:linear-gradient(90deg,#a58c5b,#e5d3a5);width:0}.count{display:flex;justify-content:space-between;color:#c1cbd8;font-size:13px}.error{color:#ffaaaa}.btn{border:0;border-radius:9px;padding:14px 18px;background:#d9bd84;color:#17202d;font-size:17px;font-weight:bold}.btn.secondary{background:#29374a;color:#e7ebf2;border:1px solid #64738a}.btn.full{width:100%;margin-top:17px}.buttonrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.buttonrow .btn{font-size:14px;padding:10px 14px}.hidden{display:none!important}.choices{display:grid;gap:10px;margin-top:20px}.choice{text-align:left;background:#202c3c;border:1px solid #4c5a6d;border-radius:10px;padding:15px;color:#f2f4f8;line-height:1.7}.choice:hover{border-color:#ddc18a;background:#29384b}.choice strong{display:block;font-size:17px}.choice span{display:block;color:#b9c6d6;font-size:13px;margin-top:4px}.story{white-space:pre-line;line-height:2;color:#d6deea}.chapter{font-family:"Times New Roman",serif;color:#d9c18e;letter-spacing:2px;font-size:12px}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.info>div{background:#111a27;border-radius:8px;padding:10px;font-size:12px;color:#acb8c9}.info b{display:block;color:#f0dfb9;font-size:19px;margin-top:4px}.log{max-height:210px;overflow:auto;line-height:1.8;color:#c0ccda;font-size:13px;padding-left:20px}.quote{background:#111a27;border-left:3px solid #d1b77f;padding:12px 15px;color:#e6d6b4;line-height:1.8;margin-top:14px}.footer{text-align:center;color:#8794a7;font-size:12px;margin-top:22px}.modal{position:fixed;inset:0;z-index:10;background:#050a12cc;display:flex;align-items:center;justify-content:center;padding:18px}.modal-box{width:min(560px,100%);max-height:85vh;overflow:auto;background:#1b2635;border:1px solid #6a7890;border-radius:16px;padding:24px;box-shadow:0 25px 90px #0009}.modal-box h2{font-size:25px;margin:0 0 12px}.modal-box p{line-height:1.9;color:#d6deea}.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.sex-row{display:flex;gap:10px}.sex-row button{flex:1}.selected{outline:2px solid #e3c98f!important;border-color:#e3c98f!important}.profile-name{font-size:22px;color:#f0dfb9;font-weight:bold}.smallnote{font-size:12px;color:#aeb9c8;line-height:1.7;margin-top:10px}
@media(max-width:650px){.wrap{padding:17px 10px 45px}.card{padding:17px}.top{align-items:flex-start}.brand{font-size:27px}.info{grid-template-columns:repeat(2,1fr)}.field{grid-template-columns:1fr 84px}.modal-box{padding:19px}}
</style></head>
<body>
<main class="wrap">
<header class="top"><div><h1 class="brand">研究生重开模拟器</h1><div class="muted">人生可以重开，但这次一定要考上研究生。</div></div><span class="pill" id="phaseBadge">角色创建</span></header>
<section id="setup" class="card">
<div class="eyebrow">CHARACTER CREATION</div><h2>先决定你的人生起点</h2>
<p class="intro">选择性别，并分配100点初始属性。五项数值均为0–100的整数，总和不能超过100。高考起始年龄为18岁。</p>
<div><strong>性别</strong><div class="sex-row" style="margin-top:10px"><button class="choice selected" id="sexF" type="button"><strong>女性</strong></button><button class="choice" id="sexM" type="button"><strong>男性</strong></button></div></div>
<div id="fields"></div><div class="meter"><div class="fill" id="fill"></div></div><div class="count"><span id="spent">已分配 0 / 100</span><span id="remaining">剩余 100 点</span></div><div id="validation" class="smallnote"></div>
<button id="confirm" class="btn full" type="button">确认属性</button>
<div class="smallnote">输入数值后确认，将弹出综合人物档案。页面不会提前显示属性加成。</div>
</section>
<section id="game" class="hidden"><div class="card"><div class="chapter" id="chapterName"></div><h2 id="sceneTitle"></h2><p class="story" id="sceneText"></p><div class="choices" id="choices"></div><div class="buttonrow"><button class="btn secondary" id="save" type="button">保存进度</button><button class="btn secondary" id="restart" type="button">重开人生</button></div></div>
<div class="card" style="margin-top:14px"><div class="muted">人生状态</div><div class="info" id="stats"></div><div class="quote" id="profileQuote"></div><h3>人生手记</h3><ol class="log" id="logs"></ol></div></section>
<div class="footer">架空城市与高校 · 游戏制作者：胖虎嫡亲表舅</div>
</main>
<div class="modal hidden" id="profileModal" role="dialog" aria-modal="true"><div class="modal-box"><div class="eyebrow">YOUR CHARACTER</div><h2>你的人物档案</h2><div class="profile-name" id="modalName"></div><p id="modalBio"></p><div class="quote" id="modalQuote"></div><div class="modal-actions"><button class="btn" id="startLife" type="button">开启人生</button><button class="btn secondary" id="editProfile" type="button">返回修改</button></div></div></div>
<div class="modal hidden" id="eventModal" role="dialog" aria-modal="true"><div class="modal-box"><div class="eyebrow">EVENT</div><h2 id="eventTitle"></h2><p id="eventText"></p><div class="choices" id="eventChoices"></div></div></div>
<script>
'use strict';
const KEY='yueshen_graduate_restart_v7';
const $=id=>document.getElementById(id);
const defs=[
{key:'money',name:'金钱属性',tiers:['贫困家庭','温饱家庭','小康家庭','富裕家庭','富二代'],texts:['你出生在经济拮据的家庭。别人计划旅行，你先研究食堂哪个窗口最实惠。','家里能维持温饱，生活不算宽裕，但基本需求有保障。','家庭条件小康，能支持正常求学，额外开销仍需规划。','家庭条件优越，学习资料和备考支出通常不是大问题。','你不必为日常生活费发愁，但人生仍有金钱买不到的难题。']},
{key:'int',name:'智力水平',tiers:['愚笨','正常人','小聪明','脱颖而出','天选科研之子'],texts:['知识似乎总比你快半步，但肯下功夫仍然有机会追上。','你是普通人，需要靠持续学习和练习积累优势。','理解新知识较快，偶尔临时抱佛脚也能应付。','学习能力出众，常常能更快抓住复杂问题的重点。','你拥有突出的学习潜力，但考试、科研仍受准备和机遇影响。']},
{key:'face',name:'颜值属性',tiers:['其貌不扬','相貌普通','五官端正','颜值出众','颜值天花板'],texts:['你有自己的辨识度，外貌不一定符合大众审美。','外貌普通，放在人群里并不显眼。','五官端正，整体耐看。','外貌出众，容易给人留下深刻的第一印象。','你有很强的外貌优势，但人生可不只靠脸。']},
{key:'taste',name:'审美属性',tiers:['审美灾难','审美普通','略有品味','审美出众','时尚教父'],texts:['你对搭配有自己的想法，旁人可能需要一点时间理解。','审美中规中矩，实用至上。','开始形成个人风格，搭配与排版较协调。','审美突出，善于把信息呈现得清晰好看。','你对视觉和设计有敏锐直觉，作品常常令人眼前一亮。']},
{key:'social',name:'社交属性',tiers:['社交绝缘体','慢热内向','正常社交','八面玲珑','社交天花板'],texts:['主动社交对你来说是高难度任务。','你慢热，需要熟悉后才容易打开话匣子。','你能正常交流和合作，不一定喜欢成为焦点。','你善于沟通，能比较自然地建立联系。','你很会与人打交道，但关系经营仍需边界与真诚。']}
];
const tier=n=>n>=40?4:n>=30?3:n>=20?2:n>=10?1:0, clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
let gender='female',G=null,pendingProfile=null;
function vals(){return Object.fromEntries(defs.map(d=>[d.key,Number($(d.key).value)]))}
function profile(a){const hit=[
[a.money>=40&&a.taste<10,'行走的奢侈品专柜','你家境优越，全身名牌，却总能把昂贵单品搭配出令人沉默的效果。银行卡余额很充足，审美仍有进步空间。','人生不缺钱，缺一位愿意说实话的造型师。'],
[a.money>=40&&a.int>=40,'人生体验卡豪华版','你拥有优越的家庭条件和出色的学习潜力。别人努力学习改变命运，你可能只是单纯喜欢钻研。','资源是助力，不是替你走完人生的自动导航。'],
[a.int>=40&&a.social<10,'孤独的科研天才','你理解问题很快，却可能为如何给老师发一句消息纠结半小时。','论文可以读十篇，微信消息可以想三天。'],
[a.money<10&&a.int>=40,'寒门科研天才','家庭经济条件有限，但你拥有很强的学习潜力。奖学金与持续努力会成为重要支点。','起点不高，目标可以很远。'],
[a.int<10&&a.social>=40,'人脉型选手','你很会和人打交道，报告内容可能没完全听懂，茶歇时却已经认识了主讲人。','人脉可以提供机会，知识仍需自己补齐。'],
[a.face>=40&&a.int>=40,'学霸偶像','外貌和学习能力都很突出，校园里关于你的传闻可能同时出现在表白墙和成绩榜。','颜值是加分项，考试还是要认真准备。'],
[a.face>=40&&a.social<10,'沉默的校园焦点','你外貌出众，却不擅长主动社交。别人以为你高冷，其实你只是在想怎么开口。','第一印象不难，建立关系需要练习。'],
[a.money<10&&a.taste>=40,'贫穷时尚大师','预算有限却有出众审美，你研究折扣和二手平台的能力同样值得称赞。','品味不一定昂贵，生活需要精打细算。'],
[a.money>=40&&a.face<10,'钞能力选手','你的家庭资源很充足，但外貌不是优势。你有更多试错机会，也需要培养真正属于自己的能力。','钱能解决一部分问题，不是所有问题。'],
[a.face<10&&a.taste>=40,'气质型选手','你的外貌不走传统路线，但穿搭与气质有自己的风格。','外貌不是唯一的名片。'],
[a.social>=40&&a.int>=30,'沟通型潜力股','你既能学习，也善于沟通，往往更容易融入团队并争取合作机会。','会合作是优势，关键时刻仍要靠实力。']
].find(x=>x[0]);
if(hit)return {name:hit[1],bio:hit[2],quote:hit[3]};
let sorted=[...defs].sort((x,y)=>a[y.key]-a[x.key]),hi=sorted[0],lo=sorted[4];
return {name:hi.tiers[tier(a[hi.key])]+'型选手',bio:`你的${hi.name}比较突出，属于“${hi.tiers[tier(a[hi.key])]}”类型；而${lo.name}则是“${lo.tiers[tier(a[lo.key])]}”。这些特点共同构成了你独特的起点。你出生于怎样的家庭、擅长什么、又在哪些方面需要成长，都将在接下来的人生里逐渐显现。`,quote:'这不是最终判决，只是故事的开头。研究生录取通知书仍要靠你一步步争取。'} }
function renderSetup(){let a=vals(),sum=Object.values(a).reduce((x,y)=>x+y,0),valid=Object.values(a).every(n=>Number.isInteger(n)&&n>=0&&n<=100)&&sum<=100;defs.forEach(d=>{$('tier-'+d.key).textContent=d.tiers[tier(clamp(a[d.key]||0))];$('label-'+d.key).title=d.texts[tier(clamp(a[d.key]||0))]});$('spent').textContent=`已分配 ${sum} / 100`;$('remaining').textContent=`剩余 ${100-sum} 点`;$('remaining').classList.toggle('error',sum>100);$('fill').style.width=Math.min(100,Math.max(0,sum))+'%';$('validation').textContent=valid?'高考起始年龄：18岁。':sum>100?'总点数不能超过100。':'每项必须输入0–100的整数。';$('confirm').disabled=!valid}
for(const d of defs){let row=document.createElement('div');row.className='field';let left=document.createElement('div'),label=document.createElement('label'),tierEl=document.createElement('div'),input=document.createElement('input');label.id='label-'+d.key;label.htmlFor=d.key;label.textContent=d.name;tierEl.className='tier';tierEl.id='tier-'+d.key;input.className='num';input.type='number';input.min='0';input.max='100';input.step='1';input.id=d.key;input.value='20';input.addEventListener('input',renderSetup);left.append(label,tierEl);row.append(left,input);$('fields').append(row)}
$('sexF').onclick=()=>{gender='female';$('sexF').classList.add('selected');$('sexM').classList.remove('selected')};$('sexM').onclick=()=>{gender='male';$('sexM').classList.add('selected');$('sexF').classList.remove('selected')};renderSetup();
$('confirm').onclick=()=>{let a=vals(),p=profile(a);pendingProfile={a,p,gender};$('modalName').textContent=p.name;$('modalBio').textContent=p.bio;$('modalQuote').textContent='系统寄语：“'+p.quote+'”';$('profileModal').classList.remove('hidden')};
$('editProfile').onclick=()=>$('profileModal').classList.add('hidden');
$('startLife').onclick=()=>{$('profileModal').classList.add('hidden');G={a:{...pendingProfile.a},origin:{...pendingProfile.a},gender:pendingProfile.gender,age:18,name:pendingProfile.p.name,stage:'exam',score:0,school:null,major:null,year:0,degree:null,prep:0,attempt:0,log:['你以18岁的年龄开始人生。'],research:0,energy:75,relationship:0,partner:false,harassment:0,integrity:70,detours:0,retakes:0,phd:false};save();renderGame()};
const schools=[{name:'上京大学',type:'985',cut:675},{name:'北海大学',type:'985',cut:645},{name:'上京理工大学',type:'985',cut:625},{name:'北海农业大学',type:'211',cut:585},{name:'北海林业大学',type:'211',cut:565},{name:'上京财经大学',type:'211',cut:555},{name:'北海师范大学',type:'一本',cut:515},{name:'北海技术学院',type:'二本',cut:465},{name:'北海应用技术学院',type:'民办本科',cut:405},{name:'北海职业技术学院',type:'高职专科',cut:0}];
function log(t){G.log.unshift(`（${G.age}岁）${t}`);G.log=G.log.slice(0,35)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
function grow(k,n){G.a[k]=clamp(G.a[k]+n)}
function scene(ch,t,txt){$('chapterName').textContent=ch;$('sceneTitle').textContent=t;$('sceneText').textContent=txt;$('choices').replaceChildren();$('phaseBadge').textContent=ch}
function choose(t,desc,fn){let b=document.createElement('button');b.className='choice';let s=document.createElement('strong'),d=document.createElement('span');s.textContent=t;d.textContent=desc;b.append(s,d);b.onclick=()=>{fn();save();renderGame();window.scrollTo(0,0)};$('choices').append(b)}
function finish(t,txt){G.stage='end';G.ending={title:t,text:txt};}
function triggerEvent(title,text,options){$('eventTitle').textContent=title;$('eventText').textContent=text;$('eventChoices').replaceChildren();options.forEach(o=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<strong></strong><span></span>';b.querySelector('strong').textContent=o.t;b.querySelector('span').textContent=o.d;b.onclick=()=>{ $('eventModal').classList.add('hidden');o.fn();save();renderGame()};$('eventChoices').append(b)});$('eventModal').classList.remove('hidden')}
function eventLove(next){triggerEvent('意外的心动','你在图书馆/实验室遇见了一个让你心动的人。对方理解你的目标，也希望你能留出时间经营关系。你会如何选择？',[{t:'认真发展这段关系',d:'给彼此一个机会。',fn:()=>{G.partner=true;G.relationship+=20;G.energy=clamp(G.energy+5);log('你决定认真经营一段关系。');G.stage=next}},{t:'暂时把重心放在升学上',d:'你不想错过眼前的目标。',fn:()=>{G.prep+=8;G.relationship-=5;log('你把更多时间留给学习。');G.stage=next}},{t:'坦诚沟通，约定彼此节奏',d:'不把感情和目标设成非此即彼。',fn:()=>{G.partner=true;G.relationship+=12;G.prep+=4;log('你与对方沟通了彼此的期待。');G.stage=next}}])}
function eventHarassment(next){triggerEvent('不舒服的越界','一位有权力影响你机会的人，开始提出与工作无关、让你感到不舒服的要求。你不需要为对方的行为负责。你决定怎么做？',[{t:'明确拒绝并保存相关记录',d:'优先保护自己，寻求可信任的支持。',fn:()=>{G.harassment++;G.integrity+=3;G.social=clamp(G.a.social+1);log('你拒绝越界要求，保存记录并寻找支持。');G.stage=next}},{t:'向可信任的人求助或正式反映',d:'寻求支持，了解可用的申诉渠道。',fn:()=>{G.harassment++;G.energy=clamp(G.energy-3);G.integrity+=5;log('你寻求可信任的支持，启动了正式求助。');G.stage=next}},{t:'暂时回避，先确保安全',d:'先离开现场，之后再决定是否求助。',fn:()=>{G.energy=clamp(G.energy-5);log('你先离开了让自己不安的环境。');G.stage=next}}])}
function eventFraud(next){triggerEvent('论文出现严重疑点','你参与的一篇论文被指出数据与原始记录存在无法解释的矛盾。你需要决定如何处理。',[{t:'如实核查，主动报告问题',d:'配合调查并更正有问题的内容。',fn:()=>{G.integrity+=10;G.research=Math.max(0,G.research-3);G.energy=clamp(G.energy-8);log('你选择如实核查并报告问题。');G.stage=next}},{t:'要求团队复核原始记录',d:'先核实事实，保留可追溯的记录。',fn:()=>{G.integrity+=5;G.energy=clamp(G.energy-5);log('你组织复核原始数据与实验记录。');G.stage=next}},{t:'隐瞒问题，试图蒙混过关',d:'你决定赌一把，但风险不会消失。',fn:()=>{G.integrity-=25;G.detours++;G.energy=clamp(G.energy-4);log('你试图隐瞒问题，留下了严重风险。');if(G.integrity<35&&Math.random()<.55)finish('学术诚信危机','调查最终发现了问题。你失去当前机会，学术道路暂时中止。你可以重新开始，但不能抹去这次选择的代价。');else G.stage=next}}])}
function maybeEvent(next,kind){let r=Math.random();if(kind==='college'&&r<.22){eventLove(next);return true}if(kind==='college'&&G.gender==='female'&&r<.38){eventHarassment(next);return true}if(kind==='research'&&r<.27){eventFraud(next);return true}if(r<.16){triggerEvent('突然发生的变故','计划之外的事情打乱了你的节奏。你需要在短期舒适和长期目标之间做出选择。',[{t:'优先处理眼前问题',d:'稳住生活，再继续前进。',fn:()=>{G.energy=clamp(G.energy+8);log('你先处理了眼前的生活问题。');G.stage=next}},{t:'坚持原定计划',d:'按计划推进，不轻易改变方向。',fn:()=>{G.prep+=5;G.energy=clamp(G.energy-5);log('你坚持原计划完成了任务。');G.stage=next}}]);return true}return false}
function renderGame(){if(!G)return;$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('stats').replaceChildren(...[['年龄',G.age+'岁'],['性别',G.gender==='female'?'女性':'男性'],['智力',G.a.int],['金钱',G.a.money],['精力',G.energy],['备考',G.prep],['科研',G.research],['感情',G.relationship],['诚信',G.integrity]].map(([k,v])=>{let d=document.createElement('div');d.textContent=k;let b=document.createElement('b');b.textContent=v;d.append(b);return d}));$('profileQuote').textContent=`${G.name}｜目标：获得研究生录取通知书。`; $('logs').replaceChildren(...G.log.map(x=>{let li=document.createElement('li');li.textContent=x;return li}));
if(G.stage==='end'){scene('人生结局',G.ending.title,G.ending.text);choose('重新开始','回到角色创建，重新规划人生。',()=>{G=null;localStorage.removeItem(KEY);$('game').classList.add('hidden');$('setup').classList.remove('hidden');$('phaseBadge').textContent='角色创建';window.scrollTo(0,0)});return}
({exam,schools:chooseSchool,major:chooseMajor,repeat:repeatYear,college,upgrade,undergrad,prepare,results,master1,master2,master3,phdYear,detourEnding})[G.stage]?.()}
function exam(){scene('高考 · 18岁','人生第一次大考','你站在高考考场门口。三年的高中生活已经结束，接下来的一次选择，可能决定你进入哪所学校。');choose('全力冲刺','走进考场，尽力发挥。',()=>takeExam(25,-12));choose('稳扎稳打','按自己的节奏答题。',()=>takeExam(8,-3));choose('状态不佳，发挥失常','你没有进入最佳状态。',()=>takeExam(-25,5))}
function takeExam(boost,energy){G.energy=clamp(G.energy+energy);G.score=clamp(Math.round(340+G.a.int*7.3+G.a.money*.7+boost+Math.floor(Math.random()*81)-40),280,750);G.stage='schools';log('高考成绩公布：'+G.score+'分。')}
function chooseSchool(){scene('高考志愿','你的分数是 '+G.score,'选择一所可以报考的高校。学校和分数均为虚构游戏设定。');schools.forEach(s=>choose(s.name+' · '+s.type,`录取参考线 ${s.cut} 分`,()=>{if(G.score<s.cut){G.stage='repeat';G.pendingSchool=s;}else{G.school=s;G.stage=s.type==='高职专科'?'college':'major';G.degree=s.type==='高职专科'?'专科在读':'本科在读';log('你进入'+s.name+'。')}}))}
function repeatYear(){scene('复读 · 人生再次选择','分数没有达到预期','你没有达到想去的学校。复读会让年龄增长，也会增加后续升学的时间压力。你还有机会，但不能无限重来。');choose('复读一年，再考一次','重新准备高考。',()=>{if(G.retakes>=3){finish('人生重开结束','你已经连续复读三年，仍未考上大学。你决定放弃学术道路，走向其他人生。本轮模拟结束，请重开。');return}G.age++;G.retakes++;G.energy=clamp(G.energy-8);G.a.int=clamp(G.a.int+2);G.stage='exam';log('你选择复读，年龄增长至'+G.age+'岁。当前已复读'+G.retakes+'年。')});choose('接受当前可走的升学路线','不再执着于原目标，寻找可行路径。',()=>{let s=schools.find(x=>G.score>=x.cut)||schools[9];G.school=s;G.stage=s.type==='高职专科'?'college':'major';G.degree=s.type==='高职专科'?'专科在读':'本科在读';log('你接受了现实分数所能提供的路径，进入'+s.name+'。')})}
function major(){scene('本科 · 专业选择','你进入了'+G.school.name,'请选择理科或技术方向的专业。不同专业会改变后续事件，但不决定最终上限。');['生物科学','环境科学','计算机科学与技术','数学与统计','化学与材料','机械与电子工程'].forEach(m=>choose(m,'确认你的本科专业。',()=>{G.major=m;G.year=0;G.stage='undergrad';log('你选择了'+m+'。')}))}
function college(){scene('专科阶段','从这里继续向上走','你进入了'+G.school.name+'。如果目标是研究生，就必须先完成专科，再通过专升本取得本科学历。');choose('认真准备专升本','把时间放在课程与备考上。',()=>{G.prep+=20;G.energy=clamp(G.energy-7);G.stage='upgrade';G.degree='专科在读';log('你开始准备专升本。')});choose('兼职，同时复习','兼顾生活开销与升学准备。',()=>{if(G.origin.money<40)G.a.money=clamp(G.a.money+3);G.prep+=12;G.energy=clamp(G.energy-3);G.stage='upgrade';log('你一边兼职一边准备专升本。')})}
function upgrade(){scene('专升本考试','本科门槛','你需要通过专升本，才能继续本科阶段。');choose('参加专升本考试','迎接考试结果。',()=>{let n=G.prep+G.a.int*.7+Math.floor(Math.random()*30);if(n>=34){G.school=schools[7];G.degree='本科在读（专升本）';G.stage='major';G.prep=0;log('专升本成功，进入本科阶段。')}else{G.prep+=14;G.age++;G.energy=clamp(G.energy-8);log('专升本失利，你决定再准备一年。')}});choose('继续准备一年','增加准备度，年龄也会增长。',()=>{G.prep+=20;G.age++;G.energy=clamp(G.energy-5);log('你继续准备专升本。')})}
function undergrad(){if(G.year>=4){G.stage='prepare';G.degree='本科毕业';G.age+=0;return renderGame()}let y=G.year+1;scene('本科生活 · 第'+y+'年','这一年，你想怎么过？','大学生活并不只有课程。友情、恋爱、社团、实验室和未来规划，都会在不经意间改变你。');choose('专心学习','你把时间投入课程与考试。',()=>{G.a.int=clamp(G.a.int+3);G.prep+=12;G.energy=clamp(G.energy-7);advanceCollege('这一年，你在课程与考试中积累基础。')});choose('进入实验室','你开始接触科研训练。',()=>{G.research+=12;G.prep+=5;G.energy=clamp(G.energy-6);advanceCollege('你加入实验室，开始接触科研。', 'research')});choose('参加社团与活动','认识朋友，探索校园生活。',()=>{G.a.social=clamp(G.a.social+4);G.energy=clamp(G.energy+3);advanceCollege('你拓展了校园生活，也认识了新朋友。','college')});choose('实习或勤工俭学','兼顾生活与未来工作经验。',()=>{if(G.origin.money<40)G.a.money=clamp(G.a.money+4);G.prep+=5;G.energy=clamp(G.energy-4);advanceCollege('你在实践中积累经验。')})}
function advanceCollege(msg,kind){G.year++;G.age++;log(msg);if(G.year>=4){G.stage='prepare';G.degree='本科毕业';log('本科四年结束，你获得了报考研究生的资格。');return}G.stage='undergrad';if(kind&&maybeEvent('undergrad',kind))return}
function prepare(){scene('研究生入学考试','你终于站到这一步','本科毕业。你可以报考理学、工学、农学等理科方向的学术型硕士或专业型硕士。');choose('报考学术型硕士（学硕）','偏重科研训练与学术研究。',()=>{G.track='学硕';G.prep+=4;G.stage='results';G.attempt++;G.lastScore=G.prep+G.a.int*.75+G.research*.25+G.energy*.1+Math.floor(Math.random()*30);log('你参加学硕选拔。')});choose('报考专业型硕士（专硕）','偏重专业实践与应用能力。',()=>{G.track='专硕';G.prep+=7;G.stage='results';G.attempt++;G.lastScore=G.prep+G.a.int*.65+G.research*.15+G.energy*.12+Math.floor(Math.random()*30);log('你参加专硕选拔。')});choose('再准备一年','多做准备，再参加考试。',()=>{G.age++;G.prep+=18;G.a.int=clamp(G.a.int+1);G.energy=clamp(G.energy-7);log('你决定再准备一年。');if(G.age>=30){G.stage='prepare';}else G.stage='prepare'})}
function results(){let pass=G.lastScore>=68;scene('研究生录取结果',pass?'录取通知书':'本次未能录取',pass?`恭喜你，你被理科${G.track}录取。新的阶段即将开始。`:`这次考试没有成功。你可以再次备考，但年龄增长会使后续学术道路更具挑战。`);if(pass){choose('接受录取','进入硕士阶段。',()=>{G.age++;G.year=1;G.degree=G.track+'一年级';G.stage='master1';G.prep=0;log('你正式成为'+G.track+'研究生。')})}else{choose('再次备考','再给自己一次机会。',()=>{G.age++;G.prep+=17;G.energy=clamp(G.energy+5);G.stage='prepare';log('你决定再次参加研究生入学考试。')});choose('放弃学术道路，走向其他人生','这条路线会结束本轮游戏。',()=>finish('你决定另走一条路','你暂时放下了研究生目标，走向学术之外的人生。本轮模拟结束。欢迎重新开始。'))}}
function master1(){scene('硕士一年级','研究生生活开始了','课程、组会、文献阅读和研究方向选择接踵而至。导师对你的期待逐渐清晰。');choose('扎实打基础','认真学习课程和研究方法。',()=>{G.a.int=clamp(G.a.int+2);G.research+=8;G.energy=clamp(G.energy-5);G.stage='master2';G.age++;G.degree='硕士二年级';log('硕士一年级，你打下了基础。')});choose('尽早进入课题组','开始实验、数据分析和组会汇报。',()=>{G.research+=14;G.energy=clamp(G.energy-8);G.stage='master2';G.age++;G.degree='硕士二年级';log('你尽早进入课题组开展研究。');if(maybeEvent('master2','research'))return})}
function master2(){scene('硕士二年级','是时候决定下一步了','你已经熟悉课题组节奏。现在，你可以尝试转为博士生，也可以完成硕士学业后申请其他学校的博士项目。');choose('申请硕博转博','留在当前学校，提前进入博士阶段。',()=>{let chance=G.research+G.a.int+G.integrity/2+Math.floor(Math.random()*25);if(chance>=100){G.phd=true;G.stage='phdYear';G.age++;G.degree='博士阶段';log('转博申请通过，你进入博士阶段。')}else{G.stage='master3';G.age++;G.degree='硕士三年级';log('转博申请未获通过，你决定完成硕士学位。')}});choose('不转博，完成硕士后申请外校博士','保留选择空间，硕士毕业后换校申博。',()=>{G.stage='master3';G.age++;G.degree='硕士三年级';log('你决定完成硕士学位，之后申请其他学校的博士。')});choose('专注硕士课题与论文','先把眼前的研究做好。',()=>{G.research+=12;G.integrity+=3;G.stage='master3';G.age++;G.degree='硕士三年级';log('你把精力集中在硕士课题上。')})}
function master3(){scene('硕士三年级','毕业与下一站','毕业论文、答辩和申博材料一起到来。按游戏设定，你将申请不同于硕士学校的博士项目。');choose('申请其他学校博士','提交真实材料，接受申请结果。',()=>{let chance=G.research+G.a.int*.5+G.integrity*.3+Math.floor(Math.random()*30);if(chance>=75){G.stage='phdYear';G.age++;G.degree='外校博士阶段';G.phd=true;log('你获得另一所学校的博士录取。')}else{G.stage='end';G.ending={title:'硕士毕业，人生继续',text:'你完成硕士学位，但本轮没有获得外校博士录取。你可以选择就业，也可以重新开始挑战新的路线。研究生目标已经达成。'};log('硕士毕业后申博未成功。')}});choose('毕业后就业','把研究训练转化为职业能力。',()=>finish('硕士毕业，走向职场','你顺利完成硕士学位，选择进入职场。你已经实现本游戏的研究生目标。'))}
function phdYear(){scene('博士阶段','新的挑战','你进入博士阶段。研究问题越来越复杂，论文、合作、学术诚信和个人生活都需要平衡。');choose('踏实推进研究','重视数据质量和可重复性。',()=>{G.research+=12;G.integrity+=5;G.energy=clamp(G.energy-8);G.age++;log('你踏实推进研究。');if(maybeEvent('phdYear','research'))return;G.stage='phdYear'});choose('追求快速成果','你希望尽快产出论文。',()=>{G.research+=18;G.integrity-=5;G.energy=clamp(G.energy-10);G.age++;log('你选择加速产出成果。');if(maybeEvent('phdYear','research'))return;G.stage='phdYear'});choose('申请毕业或离开博士阶段','评估自己的状态与目标。',()=>finish('博士阶段告一段落','你结束了这一阶段的博士训练，接下来可以选择科研岗位、企业研发或其他道路。'))}
function detourEnding(){finish('人生歧路','你选择了一条短期看似有利、长期风险极高的歧路。机会、信任与学术声誉都可能因此失去。本轮人生结束。')}
$('save').onclick=()=>{save();$('profileQuote').textContent='进度已保存到当前浏览器。'};$('restart').onclick=()=>{if(confirm('确定放弃当前进度，重新开始人生吗？')){localStorage.removeItem(KEY);G=null;$('game').classList.add('hidden');$('setup').classList.remove('hidden');$('phaseBadge').textContent='角色创建';window.scrollTo(0,0)}};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.stage&&saved.a){G=saved;renderGame()}}catch(e){}
</script></body></html>
